name: mobile
description: "CashScope - standalone offline-first personal finance app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: 2.6.1
  go_router: ^17.1.0

  # Local persistence (encrypted SQLite)
  drift: ^2.32.1
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlcipher_flutter_libs: ^0.7.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0

  # Device-side auth + secrets
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0

  # On-device OCR (already used)
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.1

  # Networking (kept for opt-in features only: investment prices, mail, AI coach)
  dio: ^5.9.1
  http: ^1.2.0
  connectivity_plus: ^7.1.1
  google_sign_in: ^7.2.0

  # UI
  intl: ^0.20.2
  google_fonts: ^8.0.1
  fl_chart: ^1.1.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.32.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true


dependency_overrides:
  build_runner: any
  analyzer: any
  _fe_analyzer_shared: any